<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector Output</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  body.idle { cursor: none; }
  #hint { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
    background: rgba(20,20,26,.85); color: #fff; font: 15px "Segoe UI", system-ui, sans-serif; transition: opacity .4s; }
  body.idle #hint, body.full #hint { opacity: 0; pointer-events: none; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #fff; font: 18px system-ui, sans-serif; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="hint">Click anywhere (or press F) for fullscreen</div>
<div id="err"></div>
<script src="js/store.js"></script>
<script src="js/effects.js"></script>
<script src="js/audio.js"></script>
<script src="js/widgets.js"></script>
<script src="js/renderer.js"></script>
<script src="js/output.js"></script>
</body>
</html>
