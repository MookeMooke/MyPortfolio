<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121218">
<meta name="referrer" content="no-referrer">
<title>Projector Remote</title>
<style>
  :root { --bg:#121218; --panel:#1f1f2a; --line:#34344a; --text:#f0f0f6; --muted:#9a9aad; --accent:#ffd23f; --ink:#1a1500; --danger:#ff5f6d; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font: 17px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 520px; margin: 0 auto; padding: 16px 16px calc(24px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 20px; margin: 0; }
  #status { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--panel); color: var(--danger); }
  #status.on { color: #3ddc84; }
  h2 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  button { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; min-height: 60px; padding: 12px 16px; width: 100%; text-align: left; touch-action: manipulation; }
  button:active { transform: scale(.98); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  #scenes { display: grid; gap: 10px; }
  #scenes button { display: flex; align-items: center; gap: 12px; font-weight: 600; }
  #scenes button .n { color: var(--muted); font-weight: 400; width: 1.2em; }
  #scenes button[aria-pressed=true] { background: var(--accent); color: var(--ink); border-color: var(--accent); }
  #scenes button[aria-pressed=true] .n { color: var(--ink); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .row button { text-align: center; }
  #black[aria-pressed=true] { background: var(--danger); border-color: var(--danger); color: #1a0003; font-weight: 600; }
  input[type=range] { width: 100%; height: 44px; accent-color: var(--accent); margin: 0; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <header><h1>Projector Remote</h1><span id="status" role="status">Connecting…</span></header>
  <h2>Scenes</h2>
  <div id="scenes"><div class="empty">Waiting for the laptop…</div></div>
  <div class="row"><button id="prev">‹ Previous</button><button id="next">Next ›</button></div>
  <h2>Light</h2>
  <button id="black" aria-pressed="false" style="text-align:center">Blackout</button>
  <h2><label for="bright">Brightness</label></h2>
  <input type="range" id="bright" min="0" max="1" step="0.01" value="1">
</main>
<script>
(function () {
  var base = location.pathname.replace(/\/$/, '');
  var $ = function (id) { return document.getElementById(id); };
  var state = null, dragging = false, lastSent = 0, pending = null;
  function send(cmd) {
    return fetch(base + '/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cmd) })
      .catch(function () { online(false); });
  }
  function online(ok) { $('status').textContent = ok ? 'Connected' : 'Not connected'; $('status').classList.toggle('on', ok); }
  function render() {
    if (!state) return;
    var box = $('scenes'); box.textContent = '';
    state.scenes.forEach(function (s, i) {
      var b = document.createElement('button'), n = document.createElement('span'), t = document.createElement('span');
      n.className = 'n'; n.textContent = i + 1; t.textContent = s.name;
      b.append(n, t);
      b.setAttribute('aria-pressed', s.id === state.active);
      b.onclick = function () { state.active = s.id; render(); send({ scene: s.id }); };
      box.append(b);
    });
    $('black').setAttribute('aria-pressed', !!state.blackout);
    $('black').textContent = state.blackout ? 'Blackout is ON · tap to light up' : 'Blackout';
    if (!dragging) $('bright').value = state.brightness;
  }
  $('prev').onclick = function () { send({ step: -1 }); };
  $('next').onclick = function () { send({ step: 1 }); };
  $('black').onclick = function () { if (!state) return; state.blackout = !state.blackout; render(); send({ blackout: state.blackout }); };
  function bright() { // at most ~12 updates a second while sliding
    var v = +$('bright').value, now = Date.now();
    clearTimeout(pending);
    if (now - lastSent > 80) { lastSent = now; send({ brightness: v }); }
    else pending = setTimeout(function () { lastSent = Date.now(); send({ brightness: v }); }, 80);
  }
  $('bright').addEventListener('input', function () { dragging = true; bright(); });
  $('bright').addEventListener('change', function () { dragging = false; bright(); });
  function connect() {
    var es = new EventSource(base + '/events');
    es.onopen = function () { online(true); };
    es.onmessage = function (e) { online(true); try { state = JSON.parse(e.data); render(); } catch (err) {} };
    es.onerror = function () { online(false); };
  }
  connect();
})();
</script>
</body>
</html>
